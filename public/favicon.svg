<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Outer Flame Glow -->
  <path d="M256 96c0 0-88 96-88 192 0 48.6 39.4 88 88 88s88-39.4 88-88c0-96-88-192-88-192z" 
        fill="#ffffff" opacity="0.25" filter="url(#glow)"/>
        
  <!-- Main Flame Shape -->
  <path d="M256 112c0 0-80 90-80 180 0 44.2 35.8 80 80 80s80-35.8 80-80c0-90-80-180-80-180z" 
        fill="url(#flameInner)"/>
        
  <!-- Inner Flame Detail -->
  <path d="M256 220c0 0-36 45-36 80 0 19.9 16.1 36 36 36s36-16.1 36-36c0-35-36-80-36-80z" 
        fill="#10b981" opacity="0.85"/>
</svg>
